name: Capability qualification

on:
  workflow_call:
    secrets:
      qualification-index-key:
        description: HMAC key for trusted qualification-index records.
        required: false
    inputs:
      skill-path:
        description: Relative path to a skill package to admit.
        required: false
        type: string
        default: ""
      qualification-index:
        description: Repository-relative path to an optional signed qualification index.
        required: false
        type: string
        default: ""
      mcp-profile:
        description: Repository-relative path to an MCP profile JSON.
        required: false
        type: string
        default: ""
      mcp-endpoint:
        description: MCP endpoint for a server profile.
        required: false
        type: string
        default: ""
      mcp-client-command:
        description: Command for a client profile.
        required: false
        type: string
        default: ""

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  skill-admission:
    if: inputs.skill-path != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.6.0
      - run: |
          mkdir -p artifacts
          args=(--skill-dir "$SKILL_PATH" --receipt artifacts/skill-receipt.json)
          if [ -n "$QUALIFICATION_INDEX" ]; then
            args+=(--qualification-index "$QUALIFICATION_INDEX")
          fi
          python3 scripts/qualify_skill.py "${args[@]}"
          python3 scripts/validate_receipt.py \
            receipts/schema/qualification-receipt.schema.json \
            artifacts/skill-receipt.json
        env:
          QUALIFICATION_INDEX: ${{ inputs.qualification-index }}
          QUALIFICATION_INDEX_KEY: ${{ secrets.qualification-index-key }}
          SKILL_PATH: ${{ inputs.skill-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: skill-qualification-receipt
          path: artifacts/skill-receipt.json

  mcp-qualification:
    if: inputs.mcp-profile != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: npm install --global --ignore-scripts @modelcontextprotocol/conformance@0.2.0-alpha.11
      - run: |
          mkdir -p artifacts
          args=(--profile "$MCP_PROFILE" --receipt artifacts/mcp-receipt.json)
          if [ -n "$MCP_ENDPOINT" ]; then
            args+=(--endpoint "$MCP_ENDPOINT")
          fi
          if [ -n "$MCP_CLIENT_COMMAND" ]; then
            args+=(--client-command "$MCP_CLIENT_COMMAND")
          fi
          python3 scripts/qualify_mcp.py "${args[@]}"
          python3 scripts/validate_receipt.py \
            receipts/schema/qualification-receipt.schema.json \
            artifacts/mcp-receipt.json
        env:
          MCP_CLIENT_COMMAND: ${{ inputs.mcp-client-command }}
          MCP_ENDPOINT: ${{ inputs.mcp-endpoint }}
          MCP_PROFILE: ${{ inputs.mcp-profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-qualification-receipt
          path: artifacts/mcp-receipt.json
